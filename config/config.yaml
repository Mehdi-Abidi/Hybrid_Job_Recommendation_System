data:
  raw_path: data/raw
  processed_path: data/processed
  jobs_file: jobs.csv
  users_file: users.csv
  interactions_file: interactions.csv
  kaggle_dataset: airiddha/trainrev1
  use_synthetic: false
  # source: 'real' builds canonical CSVs from postings.csv + Resume.csv on first run;
  # 'canonical' reads jobs_file/users_file/interactions_file directly from raw_path.
  source: real
  synthetic:
    n_users: 1000
    n_jobs: 5000
    n_interactions: 20000
    seed: 42

ratings:
  view: 1
  save: 3
  apply: 5

split:
  test_size: 0.2
  strategy: time_based  # global temporal cutoff prevents 20-50% leakage bias (Ji et al. TOIS 2023)
  seed: 42

models:
  content_based:
    tfidf_max_features: 5000
    embedding_model: all-MiniLM-L6-v2
    embedding_dim: 384
  collaborative:
    n_factors: 64
    n_epochs: 20
    reg: 0.01
    alpha: 40.0  # iALS confidence scaling for implicit feedback (Hu/Koren/Volinsky 2008)
  popularity:
    recency_halflife_days: 30
  hybrid:
    warm_threshold: 5
    lukewarm_threshold: 1
    weights:
      warm:     {content: 0.4, collab: 0.6, popularity: 0.0}
      lukewarm: {content: 0.8, collab: 0.2, popularity: 0.0}
      cold:     {content: 0.7, collab: 0.0, popularity: 0.3}
  two_tower:
    embedding_dim: 128
    hidden_dims: [512, 256]
    dropout: 0.2
    batch_size: 1024
    epochs: 25
    lr: 0.001
    negatives_per_positive: 4
  ltr:
    objective: rank:pairwise   # LambdaRank — beats pointwise for job rec
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    n_random_negatives: 50     # per positive — Facebook KDD 2020 recipe
    n_hard_negatives: 5        # same-category not-seen negatives
  reciprocal:
    embedding_dim: 128
    hidden_dims: [256, 128]
    dropout: 0.2
    batch_size: 512
    epochs: 10
    lr: 0.001
  llm:
    model: llama-3.1-8b-instant   # Groq — fast, free-tier-friendly
    rerank_top_k: 20
    output_top_n: 10
    max_tokens: 4096

faiss:
  index_type: IVFFlat
  nlist: 100
  nprobe: 10

evaluation:
  k_values: [5, 10, 20]
  metrics: [precision, recall, ndcg, map, coverage, diversity]

paths:
  artifacts: models_artifacts
